# Analyse Big Data pour la détection en temps réel des cyberattaques
# Lancer tout :             docker compose up -d
# Lancer seulement Spark :  docker compose up -d spark-master spark-worker
# Lancer les bases NoSQL :  docker compose up -d cassandra redis

services:

  # ---------- Ingestion : Kafka (mode KRaft, sans Zookeeper) ----------
  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    ports:
      - "9092:9092"          # accès depuis ta machine (producteur Python)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 24       # Spark peut relire 24 h de messages après une panne
      KAFKA_HEAP_OPTS: -Xmx512m -Xms512m

  # Interface web pour voir les topics et les messages : http://localhost:8090
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: ids-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka

  # ---------- Traitement : Spark (1 master + 1 worker) ----------
  spark-master:
    build: ./spark
    image: ids-spark:3.5.3
    container_name: spark-master
    hostname: spark-master   # indispensable : les executors rappellent le driver par ce nom
    user: root
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "8080:8080"          # interface web du master : http://localhost:8080
      - "7077:7077"
      - "4040:4040"          # interface web d'un job en cours
    volumes:
      - ./:/opt/project      # le projet est visible dans le conteneur

  spark-worker:
    image: ids-spark:3.5.3
    container_name: spark-worker
    hostname: spark-worker
    user: root
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 3g      # executor 2,5 Go : Cassandra arrêtée pendant le batch
    ports:
      - "8081:8081"
    volumes:
      - ./:/opt/project
    depends_on:
      - spark-master

  # ---------- Bases NoSQL (exigence du projet : au moins 2) ----------
  # Cassandra : historique (métriques par fenêtre, alertes) — séries temporelles
  cassandra:
    image: cassandra:4.1
    container_name: cassandra
    hostname: cassandra
    ports:
      - "9042:9042"
    environment:
      MAX_HEAP_SIZE: 512M          # limité pour tenir sur un seul poste
      HEAP_NEWSIZE: 128M
      CASSANDRA_CLUSTER_NAME: ids-cluster
    volumes:
      - cassandra-data:/var/lib/cassandra
      - ./config/cassandra:/schema:ro
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20

  # Redis : état temps réel (dernières alertes, compteurs, seuils, anti-doublons)
  redis:
    image: redis:7.2
    container_name: redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb"]
    volumes:
      - redis-data:/data

  # ---------- Recherche et visualisation (ELK) ----------
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.3
    container_name: kibana
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"          # tableau de bord : http://localhost:5601
    depends_on:
      - elasticsearch

volumes:
  es-data:
  cassandra-data:
  redis-data:
