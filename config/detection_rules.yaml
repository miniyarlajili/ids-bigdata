# Seuils des règles de détection (modifiables sans toucher au code)
# Utilisé par l'application Spark Streaming : spark/streaming/detect.py
#
# Calibrage (14/11/2026) : seuils mesurés sur le Parquet propre, en découpant chaque jour
# en fenêtres de 10 s rejouées à 1 000 flux/s (= 10 000 flux par fenêtre) :
#   - connexions vers un même port : trafic normal <= 4 522, attaques DoS/DDoS 6 900 à 10 000
#   - paquets/s vers un même port  : trafic normal <= 36 000, DDoS HOIC/LOIC-UDP jusqu'à 14 millions
#   - connexions courtes vers 21/22 : trafic normal <= 22, force brute ~1 700 à 6 300 (médiane)
#   - ports distincts par source    : trafic normal <= 189 (jour du 20/02)

# Les seuils de comptage sont donnés pour ce débit de rejeu (flux/s).
reference_rate: 1000
# Débit réellement utilisé par le producteur (--rate). Si on rejoue à 2 000 flux/s,
# mettre 2000 ici : tous les seuils de comptage sont automatiquement multipliés par 2.
replay_rate: 1000

window:
  duration: "10 seconds"     # taille de la fenêtre glissante
  slide: "5 seconds"         # pas de glissement
  watermark: "10 seconds"    # retard toléré (l'heure des flux = heure du rejeu, donc peu de retard)

streaming:
  trigger: "2 seconds"            # un micro-batch toutes les 2 s (latence)
  max_offsets_per_trigger: 50000  # limite la taille d'un micro-batch (rattrapage après panne)
  checkpoint_dir: "/opt/project/checkpoints"
  shuffle_partitions: 4           # petit cluster : 4 partitions au lieu de 200
  top_ports_per_window: 20        # ports les plus actifs envoyés au tableau de bord

rules:
  ddos_dos:
    enabled: true
    # paquets par seconde vers un même port de destination dans la fenêtre
    max_packets_per_second: 50000
    # nombre de connexions vers un même port de destination dans la fenêtre
    max_connections_per_window: 5000
    severity: critical

  port_scan:
    enabled: true
    # nombre de ports distincts visés par une même adresse source dans la fenêtre
    # (nécessite src_ip ; les flux sans adresse IP sont ignorés par cette règle)
    max_distinct_ports: 200
    severity: high

  brute_force:
    enabled: true
    target_ports: [21, 22]   # FTP, SSH
    # une connexion est "courte" si sa durée est inférieure à ce seuil (microsecondes)
    short_flow_duration_us: 1000000
    max_short_connections_per_window: 100
    severity: high

kafka:
  bootstrap_servers: "kafka:29092"
  flows_topic: "network-flows"
  alerts_topic: "ids-alerts"

cassandra:
  host: "cassandra"
  port: 9042
  keyspace: "ids"

redis:
  host: "redis"
  port: 6379
  thresholds_key: "ids:thresholds"     # seuils calculés par le batch (prioritaires sur ce fichier)
  latest_alerts_key: "ids:alerts:latest"
  latest_alerts_max: 100

elasticsearch:
  host: "elasticsearch"
  port: 9200
  traffic_index: "ids-traffic"   # trafic global, seconde par seconde
  ports_index: "ids-ports"       # indicateurs par fenêtre et par port (ports actifs, attaques, alertes)
  alerts_index: "ids-alerts"     # alertes
